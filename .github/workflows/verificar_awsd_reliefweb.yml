name: Probar AWSD y ReliefWeb
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/verificar_awsd_reliefweb.py
      - .github/workflows/verificar_awsd_reliefweb.yml
permissions:
  contents: write
concurrency:
  group: validar-awsd-reliefweb
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Probar AWSD y ReliefWeb con secretos
        env:
          AWSD_API_KEY: ${{ secrets.AWSD_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python scripts/fase2/verificar_awsd_reliefweb.py
      - name: Registrar estado sin credenciales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/accesos_awsd_reliefweb.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: estado seguro AWSD ReliefWeb [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
