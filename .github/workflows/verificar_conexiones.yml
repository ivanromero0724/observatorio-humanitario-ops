name: Verificar conexiones privadas HAPI y OIM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase1/verificar_accesos.py
      - .github/workflows/verificar_conexiones.yml
permissions:
  contents: write
concurrency:
  group: verificar-conexiones
  cancel-in-progress: true
jobs:
  test-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente oficial DTM y requests
        run: python -m pip install 'dtmapi>=0.2.1,<1' 'requests>=2.31,<3'
      - name: Probar conexiones sin exponer credenciales
        env:
          HDX_APP_IDENTIFIER: ${{ secrets.HDX_APP_IDENTIFIER }}
          DTMAPI_SUBSCRIPTION_KEY: ${{ secrets.DTMAPI_SUBSCRIPTION_KEY }}
          DTMHNA_SUBSCRIPTION_KEY: ${{ secrets.DTMHNA_SUBSCRIPTION_KEY }}
        run: python scripts/fase1/verificar_accesos.py
      - name: Guardar únicamente el estado seguro
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase1/estado_conexiones.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: registrar estado seguro de conexiones [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
