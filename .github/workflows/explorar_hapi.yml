name: HAPI – auditoria de familias
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/explorar_hapi.py
      - .github/workflows/explorar_hapi.yml
permissions:
  contents: write
concurrency:
  group: explorar-hapi
  cancel-in-progress: true
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3'
      - name: Consultar schemas HAPI en muestra geográfica
        env:
          HDX_APP_IDENTIFIER: ${{ secrets.HDX_APP_IDENTIFIER }}
        run: python scripts/fase2/explorar_hapi.py
      - name: Guardar esquema sin credenciales ni datos originales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/hapi_catalogo_endpoints.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: esquema HAPI por familia [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
