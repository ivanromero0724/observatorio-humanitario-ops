name: ReliefWeb – reportes 35 paises ventana completa
on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/fase2/extraer_reliefweb.py
      - .github/workflows/reliefweb_reportes.yml
permissions:
  contents: write
concurrency:
  group: reliefweb-35-paises
  cancel-in-progress: true
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Extraer 90 dias completos de reportes, no guardar cuerpos ni claves
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          RELIEFWEB_DAYS: '90'
        run: python scripts/fase2/extraer_reliefweb.py
      - name: Publicar solo si las 35 consultas terminaron
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observaciones/reliefweb_reportes_americas.csv docs/fase2/reliefweb_actualizacion.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: metadatos completos ReliefWeb 35 países [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
