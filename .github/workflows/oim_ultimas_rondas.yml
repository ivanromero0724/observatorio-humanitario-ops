name: OIM DTM – ultimas rondas por operacion
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 6 * *'
  push:
    branches: [main]
    paths:
      - scripts/fase2/extraer_oim_ultimas_rondas.py
      - .github/workflows/oim_ultimas_rondas.yml
permissions:
  contents: write
concurrency:
  group: oim-ultimas-rondas
  cancel-in-progress: true
jobs:
  dtm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'dtmapi==0.2.1' 'pandas>=2.2,<4'
      - name: Descargar últimas rondas por operación
        env:
          DTMAPI_SUBSCRIPTION_KEY: ${{ secrets.DTMAPI_SUBSCRIPTION_KEY }}
        run: python scripts/fase2/extraer_oim_ultimas_rondas.py
      - name: Guardar agregados completos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observaciones/oim_dtm_ultima_ronda.csv docs/fase2/oim_actualizacion.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: últimas rondas OIM por operación [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
