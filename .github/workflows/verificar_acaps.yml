name: ACAPS - verificar token y acceso
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/verificar_acaps.py
      - .github/workflows/verificar_acaps.yml
permissions:
  contents: write
concurrency:
  group: verificar-acaps
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install 'requests>=2.31,<3'
      - name: Verificar ACAPS sin mostrar token
        env:
          ACAPS_API_TOKEN: ${{ secrets.ACAPS_API_TOKEN }}
        run: python scripts/fase2/verificar_acaps.py
      - name: Publicar solamente el estado del acceso
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/acaps_conexion.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: verificar acceso ACAPS sin secretos [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
