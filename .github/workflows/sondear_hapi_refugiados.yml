name: HAPI – comprobar filtros ACNUR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/sondear_hapi_refugiados.py
      - .github/workflows/sondear_hapi_refugiados.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3'
      - name: Verificar filtro de acogida, sexo y edad
        env:
          HDX_APP_IDENTIFIER: ${{ secrets.HDX_APP_IDENTIFIER }}
        run: python scripts/fase2/sondear_hapi_refugiados.py
      - name: Versionar esquemas, no población
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/hapi_migracion_filtros.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: filtros HAPI desplazamiento [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
