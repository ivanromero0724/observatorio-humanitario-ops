name: OIM – esquema y rondas por pais
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/inspeccionar_oim.py
      - .github/workflows/inspeccionar_oim.yml
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'dtmapi==0.2.1' 'requests>=2.31,<3'
      - name: Consultar esquemas OIM sin exponer claves
        env:
          DTMAPI_SUBSCRIPTION_KEY: ${{ secrets.DTMAPI_SUBSCRIPTION_KEY }}
        run: python scripts/fase2/inspeccionar_oim.py
      - name: Versionar solo diccionario de campos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/oim_variables.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: campos reales OIM [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
