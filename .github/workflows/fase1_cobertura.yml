name: Fase 1 - Verificar cobertura de fuentes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase1/extraer_cobertura.py
      - .github/workflows/fase1_cobertura.yml
permissions:
  contents: write
jobs:
  cobertura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install "requests>=2.31,<3"
      - name: Ejecutar extracción pública de Fase 1
        env:
          HDX_APP_IDENTIFIER: ${{ secrets.HDX_APP_IDENTIFIER }}
        run: |
          python scripts/fase1/extraer_cobertura.py \
            --output docs/fase1/resultados_cobertura.csv \
            --report docs/fase1/ejecucion_fuentes.json \
            --schema docs/fase1/esquemas_fuentes.json
      - name: Guardar metadatos verificables de cobertura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fase1/resultados_cobertura.csv docs/fase1/ejecucion_fuentes.json docs/fase1/esquemas_fuentes.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fase1): resultados de pruebas públicas [skip ci]"
            git push
          fi
