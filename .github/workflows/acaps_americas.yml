name: ACAPS – severidad y acceso 35 paises
on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 5 * *'
  push:
    branches: [main]
    paths:
      - scripts/fase2/extraer_acaps.py
      - .github/workflows/acaps_americas.yml
permissions:
  contents: write
concurrency:
  group: acaps-americas
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Extraer dos datasets completos
        env:
          ACAPS_API_TOKEN: ${{ secrets.ACAPS_API_TOKEN }}
        run: python scripts/fase2/extraer_acaps.py
      - name: Guardar agregados, no credenciales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/observaciones/acaps_*.csv docs/fase2/acaps_actualizacion.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: ACAPS severity y acceso verificadas [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
