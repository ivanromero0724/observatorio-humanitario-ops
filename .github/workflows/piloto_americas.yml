name: Piloto regional - 35 paises HAPI y OIM
on:
  workflow_dispatch:
  schedule:
    - cron: '10 13 6 * *'
  push:
    branches: [main]
    paths:
      - scripts/fase1/monitorear_americas.py
      - scripts/fase1/validar_americas.py
      - data/catalogos/paises_americas.csv
      - .github/workflows/piloto_americas.yml
permissions:
  contents: write
concurrency:
  group: piloto-americas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cobertura-region:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar clientes API
        run: python -m pip install 'requests>=2.31,<3' 'dtmapi==0.2.1'
      - name: Consultar 35 paises por fuente (no imprime secretos)
        env:
          HDX_APP_IDENTIFIER: ${{ secrets.HDX_APP_IDENTIFIER }}
          DTMAPI_SUBSCRIPTION_KEY: ${{ secrets.DTMAPI_SUBSCRIPTION_KEY }}
          DTMHNA_SUBSCRIPTION_KEY: ${{ secrets.DTMHNA_SUBSCRIPTION_KEY }}
        run: python scripts/fase1/monitorear_americas.py
      - name: Verificar matriz pais por fuente
        run: python scripts/fase1/validar_americas.py
      - name: Conservar matrices de cobertura
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase1/cobertura_hapi_oim_americas.csv docs/fase1/resumen_piloto_regional.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(fase1): cobertura regional HAPI y OIM [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
