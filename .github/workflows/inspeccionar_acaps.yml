name: Explorar variables ACAPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fase2/inspeccionar_acaps.py
      - .github/workflows/inspeccionar_acaps.yml
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.31,<3'
      - name: Explorar esquemas con token privado
        env:
          ACAPS_API_TOKEN: ${{ secrets.ACAPS_API_TOKEN }}
        run: python scripts/fase2/inspeccionar_acaps.py
      - name: Registrar esquemas, nunca datos sensibles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/fase2/acaps_esquemas.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: diccionario de campos ACAPS [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
