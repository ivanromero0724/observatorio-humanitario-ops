name: Revision visual de alineacion del dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probar_layout_browser.py
      - .github/workflows/revisar_diseno.yml
      - observatorio_v3.py
      - observatorio_v4.py
      - observatorio_v5.py
      - observatorio_v6.py
      - paginas_laura.py
      - app.py
      - ui_ops.py
      - graficos.py
permissions:
  contents: read
jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias del dashboard y Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Ejecutar Streamlit en navegador real
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8501/_stcore/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8501/_stcore/health || { cat /tmp/app.log; exit 1; }
          python scripts/probar_layout_browser.py
      - name: Guardar capturas y resultado de geometría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-observatorio-ops
          path: docs/qa_capturas/
          retention-days: 14
